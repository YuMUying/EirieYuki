[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcr-weld-seam"
version = "0.1.0"
description = "Weld segmentation, centerline extraction and RGB-D projection runtime."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "opencv-contrib-python-headless>=4.8,<4.12",
  "PyYAML>=6.0",
  "onnxruntime>=1.17,<2.0",
]

[tool.setuptools]
packages = ["weld_seam"]
