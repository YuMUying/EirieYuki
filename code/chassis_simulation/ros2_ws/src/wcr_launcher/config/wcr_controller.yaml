/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz
  
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
  
      driving_velocity_controller:
        type: forward_command_controller/ForwardCommandController
  
      steering_position_controller:
        type: forward_command_controller/ForwardCommandController

      probe_rail_position_controller:
        type: forward_command_controller/ForwardCommandController
  
  joint_state_broadcaster:
    ros__parameters:
      # Empty lists publish every state interface exposed by the active variant.
      joints: []
      interfaces: []
  
  driving_velocity_controller:
    ros__parameters:
      joints:
        - FL_wheel
        - BL_wheel
        - BR_wheel
        - FR_wheel
      interface_name: velocity
  
  steering_position_controller:
    ros__parameters:
      joints:
        - FL_steering
        - BL_steering
        - BR_steering
        - FR_steering
      interface_name: position
      command: [0.0, 0.0, 0.0, 0.0]

  probe_rail_position_controller:
    ros__parameters:
      joints:
        - probe_rail_joint
      interface_name: position
      command: [0.0]
