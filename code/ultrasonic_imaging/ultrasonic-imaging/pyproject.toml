[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasonic-imaging"
version = "0.1.0"
description = "Linux-compatible phased-array FMC/PWI and TOFD ultrasonic imaging tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robot Challenge Cup ultrasonic imaging project"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "h5py>=3.10"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
ultra-image = "ultrasonic_imaging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
